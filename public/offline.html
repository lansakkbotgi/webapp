<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ออฟไลน์ - ลานสัก AI</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Sarabun", sans-serif;
      background: #0d1117;
      color: #f0f6fc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 24px;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 32px 24px;
      border-radius: 20px;
      max-width: 320px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    h1 {
      font-size: 20px;
      margin: 0 0 12px 0;
    }
    p {
      color: #8b949e;
      font-size: 14px;
      line-height: 1.5;
      margin: 0 0 24px 0;
    }
    .btn {
      display: inline-block;
      background: #3b82f6;
      color: white;
      padding: 12px 24px;
      text-decoration: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="card">
    <div style={{ fontSize: '48px', marginBottom: '16px' }}>📡</div>
    <h1>ไม่มีการเชื่อมต่ออินเทอร์เน็ต</h1>
    <p>ระบบผู้ช่วยสายตรวจลานสักต้องการการเชื่อมต่ออินเทอร์เน็ตเพื่อติดต่อ AI และวิเคราะห์ข้อมูลใน Google Sheets</p>
    <a href="javascript:window.location.reload(true)" class="btn">ลองใหม่อีกครั้ง</a>
  </div>
</body>
</html>
